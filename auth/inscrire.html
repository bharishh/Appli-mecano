<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="../css/pageConnexion.css">
</head>

<body>

<div class="login-page">
    <div class="login-card">

        <div class="login-header">
            <img src="../asset/logoGarage.png" alt="Logo">
            <div class="header-text">
                <h1>AutoPlus</h1>
                <p>Créer un compte</p>
            </div>
        </div>

        <div class="login-content">
            <h2>Inscription</h2>

            <form id="registerForm">

                <label>Nom</label>
                <input type="text" id="nom" required>

                <label>Prénom</label>
                <input type="text" id="prenom" required>

                <label>Email</label>
                <input type="email" id="email" required>

                <label>Téléphone</label>
                <input type="text" id="telephone" required>

                <label>Mot de passe</label>
                <input type="password" id="password" required>

                <label>Confirmer mot de passe</label>
                <input type="password" id="confirmPassword" required>

                <button type="submit">S'inscrire</button>
            </form>

            <div class="links">
                <a href="../index.html">Déjà un compte ? Se connecter</a>
            </div>
        </div>

    </div>
</div>

<script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const nom = document.getElementById("nom").value;
        const prenom = document.getElementById("prenom").value;
        const email = document.getElementById("email").value;
        const telephone = document.getElementById("telephone").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            alert("Les mots de passe ne correspondent pas !");
            return;
        }

        const user = {
            nom,
            prenom,
            email,
            telephone,
            password
        };

        try {
            const response = await fetch("http://localhost:8080/api/garage/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(user)
            });

            if (!response.ok) {
                throw new Error("Erreur inscription");
            }

            alert("Compte créé avec succès !");
            window.location.href = "index.html";

        } catch (error) {
            console.error(error);
            alert("Erreur lors de l'inscription");
        }
    });
</script>

</body>
</html>
